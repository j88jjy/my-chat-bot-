<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Smart Friendly Chatbot</title>
<style>
  body {
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    background-color: #e0f7fa;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #00796b;
  }
  #chatContainer {
    width: 100%;
    max-width: 700px;
    height: 550px;
    margin: 0 auto 20px auto;
    background: #ffffff;
    border-radius: 10px;
    border: 2px solid #009688;
    padding: 15px;
    overflow-y: auto;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
  }
  .message {
    margin: 8px 0;
    padding: 10px 15px;
    border-radius: 20px;
    max-width: 75%;
    font-size: 1.1em;
  }
  .user {
    align-self: flex-end;
    background-color: #b2dfdb;
    color: #333;
  }
  .bot {
    align-self: flex-start;
    background-color: #cfd8dc;
    color: #333;
  }
  #inputForm {
    display: flex;
    justify-content: center;
    max-width: 700px;
    margin: 0 auto;
  }
  #commandInput {
    width: 70%;
    padding: 12px 15px;
    font-size: 1.2em;
    border-radius: 5px;
    border: 2px solid #009688;
    outline: none;
  }
  #commandInput::placeholder {
    color: #999;
  }
  #sendButton {
    padding: 12px 20px;
    margin-left: 10px;
    font-size: 1.2em;
    background-color: #009688;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  #sendButton:hover {
    background-color: #00796b;
  }
  #tips {
    max-width: 700px;
    margin: 10px auto;
    padding: 10px;
    background-color: #e0f2f1;
    border-radius: 8px;
    border: 1px solid #00695c;
    font-size: 1em;
    color: #00695c;
  }
</style>
</head>
<body>

<h1>?? Your Smarter Friendly Chatbot! ??</h1>

<div id="tips">
  Tip: Ask me "How are you?", "What's your name?", or just say hi! You can also give commands like "print Hello", "add 4 5", or "subtract 10 3".
</div>

<div id="chatContainer"></div>

<form id="inputForm" onsubmit="event.preventDefault(); runCommand();">
  <input type="text" id="commandInput" placeholder="Say something or give me a command..." autocomplete="off" />
  <button type="submit" id="sendButton">Send</button>
</form>

<script>
const chatContainer = document.getElementById('chatContainer');

function addMessage(text, sender) {
  const msg = document.createElement('div');
  msg.className = 'message ' + sender;
  msg.textContent = text;
  chatContainer.appendChild(msg);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

// Welcome message
addMessage("Hi there! ?? I'm your smarter friendly assistant. How can I help you today?", 'bot');

// Expanded pattern matching for better understanding
function getResponse(input) {
  const message = input.toLowerCase().trim();

  // Recognize friendly questions with multiple phrasings
  const greetings = ['how are you', 'how are you today', 'what\'s up', 'hi', 'hello', 'hey'];
  if (greetings.some(g => message.includes(g))) {
    return "I'm doing well! Thanks for asking. ?? How are you?";
  }

  const nameQuestions = ['what is your name', 'who are you', 'your name'];
  if (nameQuestions.some(n => message.includes(n))) {
    return "I'm your friendly AI chatbot, here to chat and help!";
  }

  const byePhrases = ['bye', 'goodbye', 'see you', 'exit'];
  if (byePhrases.some(b => message.includes(b))) {
    return "Goodbye! ?? Feel free to chat anytime!";
  }

  const thanksPhrases = ['thank you', 'thanks'];
  if (thanksPhrases.some(t => message.includes(t))) {
    return "You're very welcome! ??";
  }

  // Simple pattern for greetings
  const greetingsResponses = ['Hello!', 'Hi there!', 'Hey! How can I assist you?'];
  if (['hello', 'hi', 'hey'].includes(message)) {
    return greetingsResponses[Math.floor(Math.random() * greetingsResponses.length)];
  }

  // Commands
  if (message.startsWith('print ')) {
    return input.substring(6);
  } else if (message.startsWith('add ')) {
    const args = input.substring(4).split(' ').map(Number);
    if (args.some(isNaN)) {
      return "Oops! Please provide numbers after 'add'. Example: add 4 5";
    } else {
      return "The sum is: " + args.reduce((a, b) => a + b, 0);
    }
  } else if (message.startsWith('subtract ')) {
    const args = input.substring(9).split(' ').map(Number);
    if (args.some(isNaN) || args.length < 2) {
      return "Please provide at least two numbers after 'subtract'. Example: subtract 10 3";
    } else {
      let res = args[0];
      for (let i = 1; i < args.length; i++) {
        res -= args[i];
      }
      return "Result: " + res;
    }
  }

  // Fallback for more natural conversation
  return "I'm here to chat! You can ask me questions like 'How are you?', 'What's your name?', or give commands like 'print Hello' or 'add 4 5'.";
}

function runCommand() {
  const inputField = document.getElementById('commandInput');
  const userInput = inputField.value.trim();
  if (!userInput) return;

  // Show user's message
  addMessage(userInput, 'user');

  // Clear input
  inputField.value = '';

  // Get bot response
  const response = getResponse(userInput);

  // Show bot's response
  addMessage(response, 'bot');
}

// Send on Enter
document.getElementById('commandInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    runCommand();
  }
});
</script>

</body>
</html>
