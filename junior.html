<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Friendly Chatbot</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
  }
  #chatContainer {
    width: 600px;
    max-width: 100%;
    height: 400px;
    margin: 0 auto 20px auto;
    background: #fff;
    border: 1px solid #ccc;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .message {
    margin: 5px 0;
    padding: 8px 12px;
    border-radius: 20px;
    max-width: 80%;
  }
  .user {
    align-self: flex-end;
    background-color: #dcf8c6;
  }
  .bot {
    align-self: flex-start;
    background-color: #ececec;
  }
  #inputForm {
    display: flex;
    justify-content: center;
  }
  #commandInput {
    width: 70%;
    padding: 10px;
    font-size: 16px;
  }
  #sendButton {
    padding: 10px 20px;
    font-size: 16px;
    margin-left: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Friendly Chatbot</h1>

<div id="chatContainer"></div>

<form id="inputForm" onsubmit="event.preventDefault(); runCommand();">
  <input type="text" id="commandInput" placeholder="Type your message..." autocomplete="off" />
  <button type="submit" id="sendButton">Send</button>
</form>

<script>
const chatContainer = document.getElementById('chatContainer');

function addMessage(text, sender) {
  const msg = document.createElement('div');
  msg.className = 'message ' + sender;
  msg.textContent = text;
  chatContainer.appendChild(msg);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function getResponse(input) {
  const message = input.toLowerCase().trim();

  // Basic greeting responses
  if (message.includes('how are you')) {
    return "I'm good, thank you! How can I assist you today?";
  } else if (message.includes('what is your name') || message.includes('who are you')) {
    return "I'm your friendly chatbot!";
  } else if (message.includes('bye') || message.includes('exit')) {
    return "Goodbye! Have a great day!";
  } else if (message.includes('thank you') || message.includes('thanks')) {
    return "You're welcome!";
  } else if (message.startsWith('print ')) {
    return input.substring(6);
  } else if (message.startsWith('add ')) {
    const args = input.substring(4).split(' ').map(Number);
    if (args.some(isNaN)) {
      return "Error: 'add' command requires numeric arguments.";
    } else {
      return args.reduce((a, b) => a + b, 0).toString();
    }
  } else if (message.startsWith('subtract ')) {
    const args = input.substring(9).split(' ').map(Number);
    if (args.some(isNaN) || args.length < 2) {
      return "Error: 'subtract' requires at least two numeric arguments.";
    } else {
      let res = args[0];
      for (let i = 1; i < args.length; i++) {
        res -= args[i];
      }
      return res.toString();
    }
  } else {
    return "I'm here to help! You can ask me things like 'How are you?', 'What's your name?', or give commands like 'print Hello', 'add 5 10', etc.";
  }
}

function runCommand() {
  const inputField = document.getElementById('commandInput');
  const userInput = inputField.value.trim();
  if (!userInput) return;

  // Show user's message
  addMessage(userInput, 'user');

  // Clear input
  inputField.value = '';

  // Get bot response
  const response = getResponse(userInput);

  // Show bot's message
  addMessage(response, 'bot');
}

// Enable pressing Enter to send
document.getElementById('commandInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    runCommand();
  }
});
</script>

</body>
</html>
